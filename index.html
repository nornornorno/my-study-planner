<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مخططي الدراسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div><h1>مخططي الدراسي</h1><p>نظّم وقتك، مهامك، ودراستك بسهولة</p></div>
      <div class="actions"><button id="settingsBtn" class="btn secondary">⚙ الإعدادات</button><button id="saveBtn" class="btn">💾 حفظ</button></div>
    </header>
    <nav class="tabs"><button class="tab active" data-tab="schedule">الجدول الأسبوعي</button><button class="tab" data-tab="tasks">المهام</button></nav>
    <main>
      <section id="scheduleTab" class="tab-panel active"><div class="section-head"><div><h2>الجدول الأسبوعي</h2><span id="routineInfo"></span></div><button id="colorBtn" class="plus-btn" title="تغيير لون الخلفية">＋</button></div><div id="schedule" class="schedule-wrap"></div></section>
      <section id="tasksTab" class="tab-panel"><div class="section-head"><div><h2>مهامي</h2><span>أضف مهامك وتابع إنجازها</span></div><button id="addTaskBtn" class="btn">＋ إضافة مهمة</button></div><div id="tasksList" class="tasks-list"></div></section>
    </main>
    <footer><span>يتم الحفظ تلقائياً على هذا المتصفح.</span><span id="saveStatus">جاهز</span></footer>
  </div>
  <div id="setupModal" class="modal hidden"><div class="modal-card"><h2>لنبدأ بتنظيم يومك 🌷</h2><p>اختر وقت الاستيقاظ ووقت نهاية الجدول.</p><label>وقت الاستيقاظ<input id="wakeInput" type="time" value="07:00"></label><label>وقت نهاية الجدول<input id="endInput" type="time" value="22:00"></label><button id="startBtn" class="btn full">بدء التخطيط</button></div></div>
  <div id="taskModal" class="modal hidden"><div class="modal-card"><button id="closeTaskBtn" class="close">×</button><h2 id="taskModalTitle">إضافة مهمة</h2><label>اسم المهمة<input id="taskTitle" type="text" placeholder="مثلاً: مراجعة المحاضرة"></label><label>اليوم<select id="taskDay"></select></label><label>الوقت<input id="taskTime" type="time"></label><label>الأولوية<select id="taskPriority"><option value="عالية">عالية</option><option value="متوسطة" selected>متوسطة</option><option value="منخفضة">منخفضة</option></select></label><button id="saveTaskBtn" class="btn full">حفظ المهمة</button></div></div>
  <script src="app.js"></script>
</body>
</html>
